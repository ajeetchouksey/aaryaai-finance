# Germany country pack — rules as data. Numbers verified September 2026; each rule names its source.
# Edit freely or override in <data folder>/packs/DE/pack.yaml.
code: DE
name: Germany
flag: "🇩🇪"
currency: EUR
locale: de-DE
default_folder: Germany
description: German income tax (§32a EStG), Abgeltungsteuer, filing deadlines, and German document types.

account_types: [Girokonto (current), Tagesgeld (savings), Festgeld (fixed deposit), Depot (broker), Kreditkarte, Bausparvertrag, Loan]
categories:
  income: [Salary, Bonus, Kindergeld, Tax refund, Interest, Dividends]
  expense: [Rent / Warmmiete, Nebenkosten, Rundfunkbeitrag, Insurance, Kita / school, Deutschlandticket]

questions:
  - id: de_mandatory_filing
    label: "Do you HAVE to file a German tax return each year? (e.g. married with tax classes III/V, side income over €410, wage-replacement benefits over €410)"
    type: bool
  - id: de_joint
    label: "Married and filing jointly (Zusammenveranlagung)?"
    type: bool
  - id: de_church
    label: "Do you pay church tax (Kirchensteuer)?"
    type: bool

ai_notes: |
  Germany: residents are taxed on WORLDWIDE income. Employees' tax is withheld (Lohnsteuer); a return
  can bring a refund. Foreign capital income goes in Anlage KAP, foreign income under a treaty in Anlage AUS.
  Investment income: flat ~26.4% (Abgeltungsteuer + Soli), €1,000 allowance per person (Sparer-Pauschbetrag).

calculators:
  - id: refund
    title: German refund estimator
    engine: de_32a_refund
    params:
      workers_allowance: 1230
      church_rate: 0.09   # 8% in Bavaria and Baden-Württemberg
      # §32a EStG: (basic allowance, zone2 end, a2, zone3 end, a3, c3, c4, zone4 end, c5)
      tariffs:
        2023: [10908, 15999, 979.18, 62809, 192.59, 966.53, 9972.98, 277825, 18307.73]
        2024: [11784, 17005, 954.80, 66760, 181.19, 991.21, 10636.31, 277825, 18971.06]
        2025: [12096, 17443, 932.30, 68480, 176.64, 1015.13, 10911.92, 277825, 19246.67]
        2026: [12348, 17799, 914.51, 69878, 173.10, 1034.87, 11135.63, 277825, 19470.38]
      soli_freigrenze: {2023: 17543, 2024: 18130, 2025: 19950, 2026: 20350}
    inputs:
      - {id: year, label: Tax year, type: select, options: [2025, 2024, 2023, 2026], default: 2025}
      - {id: gross, label: Gross salary (Lohnsteuerbescheinigung line 3), type: number}
      - {id: lohnsteuer, label: Lohnsteuer withheld (line 4), type: number}
      - {id: soli_paid, label: Soli withheld (line 5), type: number}
      - {id: werbungskosten, label: Work expenses (Werbungskosten), type: number, default: 1230}
      - {id: vorsorge, label: Deductible insurance (Vorsorge), type: number}
      - {id: other, label: "Other deductions (donations, childcare…)", type: number}
      - {id: joint, label: Joint filing (combined figures), type: bool, from_answer: de_joint}
      - {id: church, label: Church tax, type: bool, from_answer: de_church}
    help: "Work expenses: commute €0.30/km (€0.38 from km 21 in 2024–25; €0.38 from km 1 from 2026), home office €6/day up to €1,260, work share of laptop/phone, courses and certifications. The first €1,230 is automatic."
  - id: capital
    title: Tax on investment income
    engine: de_capital
    params: {allowance_single: 1000, rate: 0.25, soli: 0.055, church_rate: 0.09, equity_fund_exempt: 0.30}
    inputs:
      - {id: gains, label: "Interest, dividends and gains (€)", type: number, default: 3000}
      - {id: equity_etf, label: Equity ETF / fund (30% partial exemption), type: bool, default: true}
      - {id: joint, label: "Joint (€2,000 allowance)", type: bool, from_answer: de_joint}
      - {id: church, label: Church tax, type: bool, from_answer: de_church}

deadlines:
  - id: de_return_mandatory
    title: "German tax return {tax_year} — due (no advisor)"
    due: "{tax_year+1}-07-31"
    if: de_mandatory_filing
    severity: high
    detail: "Mandatory filers must submit via ELSTER by 31 July of the following year. Late filing can cost a surcharge of at least €25 per month (§152 AO)."
    source: "§149 AO"
  - id: de_return_advisor
    title: "German tax return {tax_year} — due if a Steuerberater / Lohnsteuerhilfeverein files it"
    due: "{tax_year+2}-03-01"
    if: de_mandatory_filing
    severity: normal
    detail: "Extended deadline when an advisor prepares the return."
    source: "§149 AO"
  - id: de_return_voluntary_last
    title: "Last day for a voluntary German return for {tax_year}"
    due: "{tax_year+4}-12-31"
    if: "!de_mandatory_filing"
    severity: high
    detail: "Employees who don't have to file can still claim a refund up to four years later (Antragsveranlagung). Average refund is around €1,000."
    source: "§46 EStG, §169 AO"
  - id: de_freistellung
    title: "Check Freistellungsaufträge and Vorabpauschale cash"
    due: "{year}-01-15"
    severity: normal
    detail: "Split your €1,000 (€2,000 joint) tax-free investment allowance across your banks. In January, accumulating ETFs deduct 'Vorabpauschale' tax — keep some cash in the broker account."
    source: "§20(9) EStG, §18 InvStG"

document_rules:
  - id: de_payslip
    label: German payslip
    category: Salary & payslips
    confidence: 0.95
    match: {text_any: [bruttonetto, abrechnungderbrutto, entgeltabrechnung, verdienstabrechnung, gehaltsabrechnung], filename_any: [brutto-netto, gehaltsabrechnung, entgeltabrechnung]}
    extract:
      - {name: period, source: squashed, pattern: "f(?:ü|u)r(januar|februar|m(?:ä|a)e?rz|april|mai|juni|juli|august|september|oktober|november|dezember)(20\\d{2})", parse: de_month_year}
    route: {folder: "{folder:DE}", filename: "Brutto-Netto-Abrechnung {period_year} {period_month} {period_month_name_de}{ext}"}
  - id: de_lohnsteuerbescheinigung
    label: Lohnsteuerbescheinigung (annual wage-tax certificate)
    category: Tax — Germany
    confidence: 0.95
    match: {text_all: [lohnsteuerbescheinigung], filename_any: [lohnsteuerbescheinigung]}
    extract:
      - {name: tax_year, source: squashed, pattern: "lohnsteuerbescheinigungf(?:ü|u)r(20\\d{2})"}
      - {name: gross, pattern: "Bruttoarbeitslohn[^\\n\\d]{0,80}?(\\d[\\d.]{0,12},\\d{2})"}
      - {name: lohnsteuer, pattern: "Einbehaltene Lohnsteuer[^\\n\\d]{0,80}?(\\d[\\d.]{0,12},\\d{2})"}
    route: {folder: "{folder:DE}", filename: "Lohnsteuerbescheinigung {tax_year}{ext}"}
  - id: de_tax_return
    label: German income tax return (Einkommensteuererklärung)
    category: Tax — Germany
    confidence: 0.97
    match: {text_any: [einkommensteuererklärung, einkommensteuererklarung, hauptvordruckest], filename_any: [steuererklaerung, steuererklärung, est1a]}
    extract:
      - {name: tax_year, pattern: "\\b(20[12]\\d)\\s+Hauptvordruck"}
    route: {folder: "{folder:DE}", filename: "Einkommensteuererklaerung_{tax_year}{ext}"}
  - id: de_tax_assessment
    label: German tax assessment (Steuerbescheid)
    category: Tax — Germany
    confidence: 0.9
    match: {text_any: [einkommensteuerbescheid, festsetzungderein, bescheidfür], filename_any: [steuerbescheid, bescheid]}
    extract:
      - {name: tax_year, pattern: "(?:für|fuer)\\s+(20[12]\\d)"}
    route: {folder: "{folder:DE}", filename: "Steuerbescheid_{tax_year}{ext}"}
  - id: de_tax_class
    label: Tax-class change (Steuerklassenwechsel)
    category: Tax — Germany
    confidence: 0.9
    match: {text_any: [steuerklassenwechsel, antragaufsteuerklassen], filename_any: [steuerklassenwechsel]}
    route: {folder: "{folder:DE}"}
  - id: de_social_security
    label: Social-security / pension notice
    category: Social security & pension
    confidence: 0.97
    match: {text_any: [meldebescheinigungzursozial, renteninformation, deutscherentenversicherung], filename_any: [meldebescheinigung, renteninformation]}
    route: {folder: "{folder:DE}"}
  - id: de_compensation
    label: Employer compensation statement
    category: Employment
    confidence: 0.85
    match: {text_any: [compensationstatement, annualbasepay, gehaltsmitteilung], filename_any: [annual-review, compensation]}
    route: {folder: "{folder:DE}"}
  - id: de_bank_statement
    label: German bank statement (Kontoauszug)
    category: Bank statements
    confidence: 0.8
    match: {text_any: [kontoauszug, umsatzübersicht, ibande], filename_any: [kontoauszug, umsaetze]}
    route: {folder: "{folder:DE}/Bank", filename: "{first_month}_{stem}{ext}"}
  - id: de_broker
    label: German broker / depot document
    category: Investments
    confidence: 0.8
    match: {text_any: [wertpapierabrechnung, depotauszug, traderepublic, scalablecapital, comdirect, jahressteuerbescheinigung], filename_any: [depot, wertpapier, trade republic, scalable]}
    route: {folder: "{folder:DE}/Investments"}
  - id: de_insurance
    label: Insurance document (Versicherung)
    category: Insurance
    confidence: 0.75
    match: {text_any: [versicherungsschein, beitragsrechnung, versicherungsnummer, haftpflicht, krankenversicherung], filename_any: [versicherung, police]}
    route: {folder: "{folder:DE}/Insurance"}
  - id: de_receipt
    label: Receipt or bill (Rechnung) — may be tax-deductible
    category: Receipts & bills
    confidence: 0.6
    match: {text_all: [rechnung], text_any: [mwst, ust, "€", eur], filename_any: [rechnung, quittung]}
    route: {folder: "{folder:DE}/Receipts/{first_year}", filename: "{first_date}_{stem}{ext}"}

checklist:
  - "Declare foreign interest and dividends in Anlage KAP, even if taxed abroad."
  - "Keep receipts for work expenses (laptop, courses, commute) — they lower your taxable income."
  - "Give each bank a Freistellungsauftrag so the tax-free allowance is used automatically."

glossary:
  zvE: "German taxable income after all deductions."
  Werbungskosten: "Work-related expenses; €1,230 is allowed automatically."
  Abgeltungsteuer: "Flat ~26.4% tax (incl. Soli) on interest, dividends and gains."
  Freistellungsauftrag: "Instruction to a bank to pay out investment income tax-free up to your allowance."

# Tax facts for investing: used by Diversify (tax if you sold) and Opportunities.
investing: {capital_gains_rate: 0.26375, equity_fund_exempt: 0.30, allowance_single: 1000}

# Tax-aware checks shown on the Opportunities screen (engines in aaryaai_finance/tax/opportunities.py).
opportunities:
  - id: de_fsa
    engine: de_fsa
    params: {allowance_single: 1000, rate: 0.26375}
  - id: de_vorabpauschale
    engine: de_vorabpauschale
    # Basiszins published by the Federal Ministry of Finance each January (BMF letter). Check and update.
    params: {basiszins: {2025: 0.0253, 2026: 0.0320}, factor: 0.7, rate: 0.26375, equity_fund_exempt: 0.30}
  - id: de_loss_certificate
    engine: de_loss_certificate
    params: {deadline: "12-15", rate: 0.26375}

# The tax-year workspace (Tax return screen). Formulas: numbers, + - * /, comparisons, and/or, min/max/round, "a if c else b".
tax_workspace:
  title: "Germany {year}"
  year: calendar
  filing_hint: "Copy the values into ELSTER (Mein ELSTER → Einkommensteuererklärung) or hand the export to your adviser."
  documents:
    - {id: lstb, label: "Lohnsteuerbescheinigung", doc_types: [de_lohnsteuerbescheinigung], required: true, why: "gross pay and wage tax withheld"}
    - {id: broker, label: "Broker annual tax statement (Jahressteuerbescheinigung)", doc_types: [de_broker], why: "investment income and tax already paid"}
    - {id: receipts, label: "Receipts for work expenses", doc_types: [de_receipt], why: "laptop, courses, work equipment"}
    - {id: last_assessment, label: "Last year's tax assessment", doc_types: [de_tax_assessment], year_offset: -1, why: "losses carried forward, prepayments"}
  questions:
    - {id: gross, section: Income, label: "Gross pay (Lohnsteuerbescheinigung, line 3)", type: number, prefill: lstb.gross}
    - {id: lohnsteuer, section: Income, label: "Wage tax withheld (line 4)", type: number, prefill: lstb.lohnsteuer}
    - {id: soli_paid, section: Income, label: "Solidarity surcharge withheld (line 5)", type: number, default: 0}
    - {id: joint, section: You, label: "Married and filing jointly?", type: bool, from_answer: de_joint}
    - {id: church, section: You, label: "Church tax?", type: bool, from_answer: de_church}
    - {id: commute_km, section: Work expenses, label: "Distance to your regular workplace (km, one way)", type: number, default: 0}
    - {id: commute_days, section: Work expenses, label: "Days you travelled there", type: number, default: 0}
    - {id: homeoffice_days, section: Work expenses, label: "Days you worked from home (not on commute days)", type: number, default: 0, help: "€6 a day, up to 210 days."}
    - {id: other_work, section: Work expenses, label: "Other work expenses (courses, laptop share, work phone…)", type: number, default: 0}
    - {id: vorsorge, section: Deductions, label: "Deductible insurance you paid yourself (Vorsorge)", type: number, default: 0, help: "Leave 0 if unsure: ELSTER fills most from your employer's data."}
    - {id: children, section: Deductions, label: "Children under 14 in childcare", type: number, default: 0}
    - {id: childcare, section: Deductions, label: "Childcare costs paid (Kita, day-care; not meals)", type: number, default: 0}
    - {id: donations, section: Deductions, label: "Donations", type: number, default: 0}
    - {id: capital_income, section: Investments, label: "German investment income taxed this year (all banks)", type: number, default: 0}
    - {id: foreign_interest, section: Investments, label: "Foreign interest and dividends (e.g. Indian FD interest in €)", type: number, default: 0}
    - {id: foreign_tax, section: Investments, label: "Tax already paid abroad on that (in €)", type: number, default: 0}
  derived:
    - {id: commute, label: "Commuting allowance", value: "commute_days * (min(commute_km, 20) * 0.30 + max(commute_km - 20, 0) * 0.38) if year <= 2025 else commute_days * commute_km * 0.38"}
    - {id: homeoffice, label: "Home-office allowance", value: "min(homeoffice_days, 210) * 6"}
    - {id: work_expenses, label: "Work expenses in total", value: "commute + homeoffice + other_work"}
    - {id: childcare_deduction, label: "Childcare you can deduct", value: "min(childcare * 0.8, 4800 * max(children, 1)) if year >= 2025 else min(childcare * 2 / 3, 4000 * max(children, 1))"}
    - {id: other_deductions, label: "Other deductions", value: "childcare_deduction + donations"}
    - {id: foreign_credit, label: "Foreign tax you can credit", value: "min(foreign_tax, foreign_interest * 0.25)"}
  estimate:
    calculator: refund
    inputs: {year: "year", gross: "gross", lohnsteuer: "lohnsteuer", soli_paid: "soli_paid", werbungskosten: "work_expenses", vorsorge: "vorsorge", other: "other_deductions", joint: "joint", church: "church"}
  checks:
    - id: above_lump_sum
      title: "Itemise your work expenses"
      when: "work_expenses > 1230"
      detail: "Your work expenses ({work_expenses}) are above the €1,230 everyone gets automatically, so listing them lowers your tax."
      effect: "(work_expenses - 1230) * est_marginal"
    - id: below_lump_sum
      title: "No need to itemise work expenses"
      when: "work_expenses > 0 and work_expenses <= 1230"
      detail: "At {work_expenses} you're below the automatic €1,230 — the lump sum is used anyway."
      tone: muted
    - id: guenstiger
      title: "Tick the Günstigerprüfung (Anlage KAP)"
      when: "capital_income > 0 and est_avg_rate < 0.25"
      detail: "Your average rate is about {est_avg_rate|percent}, below the 25% flat rate on investment income. The tax office then taxes it at your lower rate."
      effect: "capital_income * (0.25 - est_avg_rate) * 1.055"
    - id: foreign_credit
      title: "Claim the tax paid abroad (Anlage KAP)"
      when: "foreign_interest > 0 and foreign_tax > 0"
      detail: "Foreign interest of {foreign_interest}: up to {foreign_credit} of the tax paid abroad is credited against German tax under the treaty."
      effect: "foreign_credit"
    - id: declare_foreign
      title: "Declare foreign interest even if taxed abroad"
      when: "foreign_interest > 0 and foreign_tax == 0"
      detail: "As a German resident your worldwide income counts. Foreign interest of {foreign_interest} goes into Anlage KAP."
      tone: muted
    - id: childcare
      title: "Deduct childcare"
      when: "childcare > 0"
      detail: "{childcare_deduction} of your childcare costs count as special expenses (Anlage Kind)."
      effect: "childcare_deduction * est_marginal"
  sheet:
    - {form: "Anlage N", field: "Bruttoarbeitslohn", value: "gross"}
    - {form: "Anlage N", field: "Einbehaltene Lohnsteuer", value: "lohnsteuer"}
    - {form: "Anlage N", field: "Erste Tätigkeitsstätte: Arbeitstage", value: "commute_days", format: days, skip_zero: true}
    - {form: "Anlage N", field: "Erste Tätigkeitsstätte: einfache Entfernung (km)", value: "commute_km", format: number, skip_zero: true}
    - {form: "Anlage N", field: "Tagespauschale Homeoffice: Tage", value: "min(homeoffice_days, 210)", format: days, skip_zero: true}
    - {form: "Anlage N", field: "Weitere Werbungskosten", value: "other_work", skip_zero: true}
    - {form: "Anlage KAP", field: "Günstigerprüfung beantragen", value: "capital_income > 0 and est_avg_rate < 0.25", format: bool}
    - {form: "Anlage KAP", field: "Ausländische Kapitalerträge", value: "foreign_interest", skip_zero: true}
    - {form: "Anlage KAP", field: "Anrechenbare ausländische Steuer", value: "foreign_credit", skip_zero: true}
    - {form: "Anlage Kind", field: "Kinderbetreuungskosten", value: "childcare", skip_zero: true}
    - {form: "Sonderausgaben", field: "Spenden", value: "donations", skip_zero: true}
    - {form: "Result", field: "Estimated refund (+) or payment (−)", value: "est_refund"}

# Extra fields this country adds to the data model (stored with each record; see CONTRIBUTING.md).
model:
  extends:
    accounts:
      fields:
        de_freistellungsauftrag:
          type: money
          label: "Freistellungsauftrag at this bank (€)"
          help: "Share of your €1,000 / €2,000 tax-free allowance given to this bank. The total across banks must not exceed it."
        de_capital_income_ytd:
          type: money
          label: "Investment income at this bank this year (€)"
          help: "Interest, dividends and realised gains so far this year (see the bank's tax overview). Used by Opportunities."
        de_losses_ytd:
          type: money
          label: "Losses at this bank this year (€)"
          help: "Unused losses in this bank's loss pot (Verlusttopf). Used to remind you about a Verlustbescheinigung."
