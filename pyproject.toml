[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaryaai-finance"
dynamic = ["version"]
description = "Local-first personal finance manager: multi-country, multi-currency, deterministic rules, optional AI (Claude, Azure OpenAI, GitHub Models, Ollama)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "aaryaai" }]
keywords = ["personal-finance", "budget", "tax", "local-first", "net-worth", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  # ranges: tested lower bound, capped below the next major version (Dependabot proposes upgrades)
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pdfplumber>=0.10,<1",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "anthropic>=0.40,<2",
  "keyring>=24,<26",
]

[project.optional-dependencies]
market = ["yfinance>=0.2,<2"]
dev = ["pytest>=8,<10", "markdown>=3.5,<4"]
ui = ["playwright>=1.45,<2"]

[project.scripts]
aaryaai-finance = "aaryaai_finance.cli:main"

[project.urls]
Homepage = "https://github.com/ajeetchouksey/aaryaai-finance"
Issues = "https://github.com/ajeetchouksey/aaryaai-finance/issues"

[tool.setuptools.dynamic]
version = { attr = "aaryaai_finance.__version__" }

[tool.setuptools.packages.find]
include = ["aaryaai_finance*"]

[tool.setuptools.package-data]
aaryaai_finance = ["web/*", "web/**/*", "packs/*/*.yaml", "packs/_template/*", "model/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests with Playwright (skipped when it is not installed)"]
