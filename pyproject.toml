[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaryaai-finance"
dynamic = ["version"]
description = "Local-first personal finance manager: multi-country, multi-currency, deterministic rules, optional AI (Claude, Azure OpenAI, GitHub Models, Ollama)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "aaryaai" }]
keywords = ["personal-finance", "budget", "tax", "local-first", "net-worth", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.24",
  "pandas>=2.0",
  "pdfplumber>=0.10",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
market = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
aaryaai-finance = "aaryaai_finance.cli:main"

[project.urls]
Homepage = "https://github.com/ajeetchouksey/aaryaai-finance"
Issues = "https://github.com/ajeetchouksey/aaryaai-finance/issues"

[tool.setuptools.dynamic]
version = { attr = "aaryaai_finance.__version__" }

[tool.setuptools.packages.find]
include = ["aaryaai_finance*"]

[tool.setuptools.package-data]
aaryaai_finance = ["web/*", "web/**/*", "packs/*/*.yaml", "packs/_template/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
